<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f5"/>
      <stop offset="1" stop-color="#e7e8ea"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f2f4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- 网格装饰 -->
  <g stroke="#d9dade" stroke-width="1" opacity="0.6">
    <path d="M40 640 H1560 M40 700 H1560 M40 760 H1560"/>
  </g>
  <!-- 玻璃卡片示意 -->
  <rect x="820" y="170" width="620" height="540" rx="28" fill="url(#card)" stroke="#d3d5da" stroke-width="1.5" filter="url(#soft)"/>
  <rect x="850" y="210" width="170" height="150" rx="12" fill="#c9cbcf"/>
  <rect x="1040" y="210" width="170" height="150" rx="12" fill="#b9bcbf"/>
  <rect x="1230" y="210" width="170" height="150" rx="12" fill="#a8abae"/>
  <line x1="850" y1="410" x2="1410" y2="410" stroke="#e4e5e7" stroke-width="2"/>
  <rect x="850" y="440" width="360" height="26" rx="13" fill="#e9eaec"/>
  <rect x="850" y="484" width="520" height="20" rx="10" fill="#e4e5e7"/>
  <rect x="850" y="516" width="470" height="20" rx="10" fill="#e4e5e7"/>
  <circle cx="1340" cy="640" r="10" fill="#101013"/>
  <!-- 文字 -->
  <text x="72" y="116" font-family="Arial, sans-serif" font-size="30" letter-spacing="6" fill="#3a3c40" font-weight="bold">RECORD / W-001</text>
  <text x="72" y="166" font-family="Arial, sans-serif" font-size="21" letter-spacing="3" fill="#71747b">LIBRARY MANAGEMENT SYSTEM</text>
  <text x="72" y="236" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="900" fill="#101013" letter-spacing="2">图书管理系统</text>
  <text x="72" y="286" font-family="Arial, sans-serif" font-size="24" letter-spacing="4" fill="#71747b">SPRING BOOT · MYBATIS · VUE</text>
  <g fill="#101013">
    <rect x="72" y="330" width="14" height="14" rx="4"/><rect x="96" y="330" width="150" height="14" rx="7" fill="#b9bcbf"/>
    <rect x="72" y="356" width="14" height="14" rx="4"/><rect x="96" y="356" width="150" height="14" rx="7" fill="#c9cbcf"/>
    <rect x="72" y="382" width="14" height="14" rx="4"/><rect x="96" y="382" width="150" height="14" rx="7" fill="#d9dade"/>
  </g>
  <text x="72" y="812" font-family="Arial, Helvetica, sans-serif" font-size="300" font-weight="900" fill="#ffffff" stroke="#c7c9cd" stroke-width="3">001</text>
