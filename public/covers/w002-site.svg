<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f5"/>
      <stop offset="1" stop-color="#e7e8ea"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0f2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="gline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101013"/>
      <stop offset="1" stop-color="#9a9ca3"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#d5d7db" stroke-width="1" opacity="0.6">
    <path d="M40 660 H1560 M40 720 H1560 M40 780 H1560"/>
  </g>
  <!-- 右侧：部署流程图示意 -->
  <g transform="translate(880 210)" filter="url(#soft)">
    <rect width="560" height="460" rx="24" fill="url(#card)" stroke="#d3d5da" stroke-width="1.5"/>
  </g>
  <g transform="translate(910 250)">
