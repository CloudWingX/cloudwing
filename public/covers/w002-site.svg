    <text x="212" y="34" font-family="Arial, monospace" font-size="15" fill="#ffffff" font-weight="bold">BUILD</text>
    <text x="212" y="58" font-family="Arial, sans-serif" font-size="13" fill="#b9babf">dist 产物</text>
    <rect x="392" y="0" width="150" height="84" rx="12" fill="#e9eaec" stroke="#cfd1d6" stroke-width="1.5"/>
    <text x="408" y="34" font-family="Arial, monospace" font-size="15" fill="#4a4c50" font-weight="bold">DEPLOY</text>
    <text x="408" y="58" font-family="Arial, sans-serif" font-size="13" fill="#8a8d93">CF Pages</text>
    <line x1="160" y1="42" x2="190" y2="42" stroke="#9a9ca3" stroke-width="3" marker-end="none"/>
    <line x1="356" y1="42" x2="386" y2="42" stroke="#9a9ca3" stroke-width="3"/>
    <g transform="translate(186 30)"><path d="M4 12 L0 8 L4 4" fill="none" stroke="#9a9ca3" stroke-width="2"/></g>
    <g transform="translate(382 30)"><path d="M4 12 L0 8 L4 4" fill="none" stroke="#9a9ca3" stroke-width="2"/></g>
    <rect x="0" y="140" width="540" height="26" rx="13" fill="#e4e5e7"/>
    <rect x="0" y="186" width="480" height="20" rx="10" fill="#e4e5e7"/>
    <rect x="0" y="218" width="500" height="20" rx="10" fill="#e4e5e7"/>
    <rect x="0" y="250" width="170" height="34" rx="17" fill="#101013"/>
    <text x="20" y="272" font-family="Arial, monospace" font-size="15" fill="#ffffff">cloudwing.pages.dev</text>
  </g>
  <!-- 左侧文字 -->
  <text x="72" y="116" font-family="Arial, sans-serif" font-size="30" letter-spacing="6" fill="#3a3c40" font-weight="bold">RECORD / W-002</text>
  <text x="72" y="166" font-family="Arial, sans-serif" font-size="21" letter-spacing="3" fill="#71747b">FROM SOURCE TO PAGES</text>
  <text x="72" y="236" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" fill="#101013" letter-spacing="2">本站的诞生</text>
  <text x="72" y="286" font-family="Arial, sans-serif" font-size="24" letter-spacing="4" fill="#71747b">ASTRO · GITHUB · CLOUDFLARE</text>
  <line x1="72" y1="330" x2="560" y2="330" stroke="url(#gline)" stroke-width="3" opacity="0.8"/>
  <g fill="#101013">
    <rect x="72" y="360" width="14" height="14" rx="4"/><text x="98" y="372" font-family="Arial, sans-serif" font-size="19" fill="#3a3c40">Astro 静态构建 · 目录式路由</text>
    <rect x="72" y="392" width="14" height="14" rx="4"/><text x="98" y="404" font-family="Arial, sans-serif" font-size="19" fill="#3a3c40">GitHub 公开仓库 · 持续部署</text>
    <rect x="72" y="424" width="14" height="14" rx="4"/><text x="98" y="436" font-family="Arial, sans-serif" font-size="19" fill="#3a3c40">Cloudflare Pages 免费托管</text>
  </g>
  <text x="72" y="812" font-family="Arial, Helvetica, sans-serif" font-size="300" font-weight="900" fill="#ffffff" stroke="#c7c9cd" stroke-width="3">002</text>
