<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f5f6"/>
      <stop offset="1" stop-color="#e6e7ea"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101013"/>
      <stop offset="1" stop-color="#c7c9cd"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 背景网格 -->
  <g stroke="#d6d8dc" stroke-width="1" opacity="0.55">
    <path d="M0 520 H1200 M0 560 H1200 M0 600 H1200"/>
  </g>

  <!-- 右侧玻璃卡（编号档案意象） -->
  <g filter="url(#soft)">
    <rect x="740" y="150" width="380" height="330" rx="22" fill="url(#glass)" stroke="#d3d5da" stroke-width="1.5"/>
  </g>
  <g transform="translate(780 190)">
    <rect x="0" y="0" width="90" height="26" rx="13" fill="#101013"/>
    <text x="14" y="18" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" letter-spacing="1">ARCHIVE</text>
    <rect x="0" y="52" width="300" height="22" rx="11" fill="#e6e7ea"/>
    <rect x="0" y="88" width="250" height="22" rx="11" fill="#e6e7ea"/>
    <rect x="0" y="124" width="280" height="22" rx="11" fill="#dfe1e4"/>
    <circle cx="18" cy="196" r="7" fill="#101013"/>
    <text x="36" y="202" font-family="Arial, sans-serif" font-size="16" fill="#5b5e64">过程可追溯</text>
    <circle cx="18" cy="230" r="7" fill="#101013" opacity="0.55"/>
    <text x="36" y="236" font-family="Arial, sans-serif" font-size="16" fill="#5b5e64">按编号留存</text>
    <circle cx="18" cy="264" r="7" fill="#101013" opacity="0.3"/>
    <text x="36" y="270" font-family="Arial, sans-serif" font-size="16" fill="#5b5e64">学习与作品档案</text>
  </g>

  <!-- 左侧品牌 -->
  <!-- HexMark 同源徽记：双同心六边形 + 中心点 -->
  <g transform="translate(84 138)" fill="none" stroke="#101013" stroke-width="2.4">
    <path d="M0 -26 L22.5 -13 L22.5 13 L0 26 L-22.5 13 L-22.5 -13 Z"/>
    <path d="M0 -14 L12.1 -7 L12.1 7 L0 14 L-12.1 7 L-12.1 -7 Z" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="4" fill="#101013" stroke="none"/>
  </g>

  <text x="84" y="232" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="900" fill="#101013" letter-spacing="-1">CLOUDWING</text>
  <text x="86" y="292" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#3a3c40" letter-spacing="10">云 翼</text>

  <line x1="84" y1="330" x2="470" y2="330" stroke="url(#rule)" stroke-width="3"/>

  <text x="84" y="382" font-family="Arial, sans-serif" font-size="24" fill="#5b5e64" letter-spacing="1">个人学习与作品档案站</text>
  <text x="84" y="420" font-family="Arial, sans-serif" font-size="20" fill="#8a8d93" letter-spacing="2">ASTRO · 磨砂玻璃扁平化 UI · 浅色 / 深色</text>

  <text x="84" y="560" font-family="Arial, monospace" font-size="20" letter-spacing="2" fill="#101013">cloudwing.pages.dev</text>
  <text x="1116" y="560" text-anchor="end" font-family="Arial, mono" font-size="20" letter-spacing="3" fill="#8a8d93">W-ARCHIVE</text>
</svg>
